<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Internship Application Form</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <main class="container my-5">
    <form id="application-form" class="row g-3 needs-validation" novalidate>

      <div class="col-md-4">
        <label for="first-name-input" class="form-label">First Name</label>
        <input
          type="text"
          class="form-control"
          id="first-name-input"
          name="firstName"
          aria-describedby="first-name-feedback"
          pattern=".*\S.*"
          required
        >
        <div id="first-name-feedback" class="invalid-feedback">
          Please enter your first name.
        </div>
      </div>

      <div class="col-md-4">
        <label for="last-name-input" class="form-label">Last Name</label>
        <input
          type="text"
          class="form-control"
          id="last-name-input"
          name="lastName"
          aria-describedby="last-name-feedback"
          pattern=".*\S.*"
          required
        >
        <div id="last-name-feedback" class="invalid-feedback">
          Please enter your last name.
        </div>
      </div>

      <div class="col-md-4">
        <label for="email-input" class="form-label">Email</label>
        <input
          type="email"
          class="form-control"
          id="email-input"
          name="email"
          aria-describedby="email-feedback"
          required
        >
        <div id="email-feedback" class="invalid-feedback">
          Please enter a valid email address.
        </div>
      </div>

      <div class="col-md-6">
        <label for="college-input" class="form-label">College Name</label>
        <input
          type="text"
          class="form-control"
          id="college-input"
          name="college"
          aria-describedby="college-feedback"
          pattern=".*\S.*"
          required
        >
        <div id="college-feedback" class="invalid-feedback">
          Please enter your college name.
        </div>
      </div>

      <div class="col-md-3">
        <label for="graduation-year" class="form-label">
          Graduation Year
        </label>
        <select
          class="form-select"
          id="graduation-year"
          name="graduationYear"
          aria-describedby="graduation-feedback"
          required
        >
          <option value="" selected disabled>Choose...</option>
          <option value="2020">2020</option>
          <option value="2021">2021</option>
          <option value="2022">2022</option>
          <option value="2023">2023</option>
        </select>
        <div id="graduation-feedback" class="invalid-feedback">
          Please select your graduation year.
        </div>
      </div>

      <div class="col-md-3">
        <label for="roll-no-input" class="form-label">Roll No</label>
        <input
          type="text"
          class="form-control"
          id="roll-no-input"
          name="rollNumber"
          aria-describedby="roll-feedback"
          pattern=".*\S.*"
          required
        >
        <div id="roll-feedback" class="invalid-feedback">
          Please enter your roll number.
        </div>
      </div>

      <div class="col-12">
        <div class="form-check">
          <input
            type="checkbox"
            class="form-check-input"
            id="conditions-checkbox"
            name="conditions"
            aria-describedby="conditions-feedback"
            required
          >
          <label for="conditions-checkbox" class="form-check-label">
            Agree to terms and conditions
          </label>
          <div id="conditions-feedback" class="invalid-feedback">
            You must agree before submitting.
          </div>
        </div>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">
          Submit form
        </button>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById("application-form");

    form.addEventListener("submit", function (event) {
      // Prevent page reload for this frontend-only assignment.
      event.preventDefault();

      form.classList.add("was-validated");

      if (!form.checkValidity()) {
        form.querySelector(":invalid").focus();
      }
    });
  </script>
</body>
</html>
